spring:
  application:
    name: meter-hub-java-provision

  datasource:
    url: jdbc:h2:file:./data/meterhub;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: "test"

    hikari:
      pool-name: meterhub-h2-pool
      maximum-pool-size: ${APP_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${APP_DB_POOL_MIN_IDLE:10}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${APP_DB_VALIDATION_TIMEOUT_MS:2000}
      max-lifetime: ${APP_DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${APP_DB_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${APP_DB_LEAK_DETECTION_MS:0}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  flyway:
    enabled: true

  mvc:
    problemdetails:
      enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

springdoc:
  api-docs:
    path: /api-docs

# Учётные записи по умолчанию (создаются при старте, см. DataInitializer)
app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@example.com}
    password: ${APP_ADMIN_PASSWORD:admin12345}
    full-name: ${APP_ADMIN_FULL_NAME:Системный администратор}
  manager:
    email: ${APP_MANAGER_EMAIL:manager@example.com}
    password: ${APP_MANAGER_PASSWORD:manager123}
    full-name: ${APP_MANAGER_FULL_NAME:Менеджер по умолчанию}

  # Периодический CSV-отчёт с последними показаниями (см. scheduling/ReportScheduler)
  report:
    recipient: ${APP_REPORT_RECIPIENT:user@example.com}
    from: ${APP_REPORT_FROM:noreply@meterhub.local}
    subject: ${APP_REPORT_SUBJECT:Показания приборов учёта}
    interval: ${APP_REPORT_INTERVAL:14d}
    initial-delay: ${APP_REPORT_INITIAL_DELAY:14d}
    period-days: ${APP_REPORT_PERIOD_DAYS:14}