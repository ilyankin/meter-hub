spring:
  application:
    name: meter-hub-java-provision

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    hikari:
      pool-name: meterhub-pool
      maximum-pool-size: ${APP_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${APP_DB_POOL_MIN_IDLE:10}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${APP_DB_VALIDATION_TIMEOUT_MS:2000}
      max-lifetime: ${APP_DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${APP_DB_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${APP_DB_LEAK_DETECTION_MS:0}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  flyway:
    enabled: true

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:15MB}

  cache:
    type: caffeine
    cache-names: tariffZones

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  info:
    git:
      mode: full

springdoc:
  api-docs:
    path: /api-docs

app:
  # Создание учётных записей при старте (см. config/DataInitializer).
  # Включён только в dev/test
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}

  auth:
    token-ttl: ${APP_AUTH_TOKEN_TTL:1d}
    # Очистка истёкших токенов (см. scheduling/TokenCleanupScheduler)
    cleanup-cron: ${APP_AUTH_CLEANUP_CRON:0 0 3 * * *}

  # Периодический CSV-отчёт с последними показаниями (см. scheduling/ReportScheduler)
  report:
    recipient: ${APP_REPORT_RECIPIENT:user@example.com}
    from: ${APP_REPORT_FROM:noreply@meterhub.local}
    subject: ${APP_REPORT_SUBJECT:Показания приборов учёта}
    interval: ${APP_REPORT_INTERVAL:14d}
    initial-delay: ${APP_REPORT_INITIAL_DELAY:14d}
    period-days: ${APP_REPORT_PERIOD_DAYS:14}
