spring:
  datasource:
    url: jdbc:h2:mem:meterhub_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: test
    password: "test"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  mvc:
    problemdetails:
      enabled: true

  mail:
    host: localhost
    port: 1025

app:
  bootstrap:
    enabled: true
    admin:
      email: admin@example.com
      password: admin12345
      full-name: Системный администратор
    manager:
      email: manager@example.com
      password: manager123
      full-name: Менеджер по умолчанию
  report:
    recipient: user@example.com
    from: noreply@meterhub.local
    subject: Показания приборов учёта
    interval: 9999d
    initial-delay: 9999d
    period-days: 14
  auth:
    token-ttl: 1d
    cleanup-cron: 0 0 3 * * *

logging:
  level:
    com.ilynkin.coding_assignment: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
